const steps=[['welcome','Briefing','Your management shift'],['inspect','Welfare inspection','Five Domains'],['housing','Winter housing','Evidence & trade-offs'],['handling','Handling lab','Flight zone & pressure'],['bio','Biosecurity map','Protect the main herd'],['decision','Decision board','Defend your choice'],['report','Final report','Your field record']];
let state={page:'welcome',scores:{},complete:{},found:[],observations:[],housing:{},pressure:35,handlingAnswer:'',bioOrder:[],bioSelected:null,answers:{},name:'',reflection:'',choice:'B',reportSaved:false};
try{const old=JSON.parse(localStorage.getItem('utva_mod14_ranch_v1'));if(old&&old.scores)state={...state,...old};}catch(e){}
const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem('utva_mod14_ranch_v1',JSON.stringify(state));}catch(e){}};const score=()=>Object.values(state.scores).reduce((a,b)=>a+b,0);const completeCount=()=>['inspect','housing','handling','bio','decision','report'].filter(k=>state.complete[k]).length;const award=(key,pts)=>{state.scores[key]=Math.max(state.scores[key]||0,pts);state.complete[key]=true;save();renderNav();};
function renderNav(){ $('nav').innerHTML='<h3>FIELD OPERATIONS</h3>'+steps.map(([id,name,sub],i)=>`<button class="nav ${state.page===id?'active':''}" onclick="go('${id}')"><span>${state.complete[id]?'✓':String(i).padStart(2,'0')}</span><span>${name}<small>${sub}</small></span></button>`).join('');$('points').textContent=score()+' / 100 pts';$('done').textContent=completeCount()+' / 6 missions';$('bar').style.width=(completeCount()/6*100)+'%';}
function go(id){state.page=id;save();render();window.scrollTo({top:0,behavior:'smooth'});}function render(){renderNav();const pages={welcome,housing,inspect,handling,bio,decision,report};$('app').innerHTML=pages[state.page]();}const next=(id)=>`<div class="actions"><button class="btn" onclick="go('${id}')">Continue →</button></div>`;
function welcome(){return `<div class="kicker">SHIFT BRIEFING • 01</div><h2>You're the ranch operations manager.</h2><p class="lead">A cold front is moving in. A handling facility needs an upgrade, a new animal has arrived, and your crew needs a defensible welfare plan. Your job: investigate the evidence, protect animals and people, and document decisions.</p><div class="grid"><div class="card photo-card"><img src="${IMAGES.calf}" alt="Real photograph of a calf resting in straw"><div class="inside"><h3>Look closely.</h3><p>Use real animal imagery and case evidence to spot concerns. A photograph is a starting point—not a diagnosis.</p></div></div><div class="card photo-card"><img src="${IMAGES.horse}" alt="Photograph of horses in a ranch enclosure"><div class="inside"><h3>Think beyond the obvious.</h3><p>Consider nutrition, environment, health, behavior, mental experiences, safety and trade-offs.</p></div></div></div><div class="note warning"><strong>Your mission:</strong> Complete six field missions for up to <strong>100 practice points</strong>. You can retry any mission. The score is for practice, not an automatically submitted Canvas grade.</div><div class="card soft"><h3>What makes this different from a quiz?</h3><p>You'll inspect photographic scenes, build an evidence log, change a live handling-pressure control, arrange a biosecurity workflow, weigh competing priorities, and write a defensible decision.</p><p class="mini">Your work saves in this browser on this device. Use the final report to document completion.</p></div>${next('inspect')}`;}
const hotspots=[{x:22,y:52,label:'Body condition / nutrition',domain:'Nutrition',evidence:'Body condition and access to suitable feed should be checked directly; appearance alone does not prove feed quality.'},{x:51,y:39,label:'Shelter and weather',domain:'Physical environment',evidence:'Check dry bedding, shelter, space, temperature and ventilation during cold weather.'},{x:79,y:57,label:'Mobility and health',domain:'Health',evidence:'Observe gait, injury, breathing and illness indicators; report abnormalities rather than guessing a diagnosis.'},{x:59,y:77,label:'Rest and behavior',domain:'Behavioral interactions',evidence:'Check whether calves can rest, move and interact normally without unnecessary disturbance.'}];
function inspect(){let f=state.found;return `<div class="kicker">MISSION 1 • 20 POINTS</div><h2>Welfare inspection: follow the evidence</h2><p class="lead">Inspect the calf scene. Select all four markers to collect observations. Then match each observation to a Five Domains category. Remember: the fifth domain—mental experiences—is influenced by the first four.</p><div class="scene"><img src="${IMAGES.calf}" alt="Photograph of calf lying in bedding; use the inspection markers to review welfare evidence">${hotspots.map((h,i)=>`<button class="hot ${f.includes(i)?'found':''}" style="left:${h.x}%;top:${h.y}%" onclick="inspectHot(${i})" aria-label="Inspect ${esc(h.label)}">${f.includes(i)?'✓':'+'}</button>`).join('')}</div><p class="scene-caption">Training image: markers prompt a welfare inspection; the image does not establish that an animal is sick or neglected.</p><div class="grid">${hotspots.map((h,i)=>`<div class="card ${f.includes(i)?'soft':''}"><strong>${f.includes(i)?'✓':'○'} ${esc(h.label)}</strong>${f.includes(i)?`<p class="mini">${esc(h.evidence)}</p><label for="domain${i}">Assign the domain</label><select class="select" id="domain${i}" onchange="setDomain(${i},this.value)"><option value="">Choose a domain</option>${['Nutrition','Physical environment','Health','Behavioral interactions','Mental experiences'].map(d=>`<option ${state.observations[i]===d?'selected':''}>${d}</option>`).join('')}</select>`:'<p class="mini">Select its marker in the photograph to reveal field notes.</p>'}</div>`).join('')}</div><div class="note"><strong>Field guide:</strong> Nutrition, physical environment, health and behavioral interactions all shape an animal's resulting mental experiences. Record what you can observe, not assumptions.</div><div class="actions"><button class="btn" onclick="gradeInspect()">Check inspection &amp; record score</button><button class="btn light" onclick="go('housing')">Next mission →</button></div><div id="feedback"></div>`;}
function inspectHot(i){if(!state.found.includes(i))state.found.push(i);save();render();}function setDomain(i,v){state.observations[i]=v;save();}function gradeInspect(){if(state.found.length<4){$('feedback').innerHTML='<div class="result err">Find all four inspection markers first.</div>';return;}let correct=hotspots.filter((h,i)=>state.observations[i]===h.domain).length;award('inspect',correct*5);$('feedback').innerHTML=`<div class="result">${correct}/4 domains correctly identified. Practice score: ${correct*5}/20. ${correct<4?'Review your choices and try again.':'Inspection complete!'} Mental experiences are the resulting psychological state, not a separate visible body part.</div>`;}
const housingItems=[['Indoor shelter shields calves from storms','benefit'],['Poor airflow may increase respiratory risk','concern'],['Restricted space may limit normal behavior','concern'],['More controlled conditions may help disease management','benefit'],['Measure ventilation and monitor respiratory signs','safeguard'],['Check space, bedding, behavior and daily records','safeguard']];
function housing(){return `<div class="kicker">MISSION 2 • 15 POINTS</div><h2>Winter housing: balance the trade-offs</h2><p class="lead">A producer wants to move calves indoors during severe storms. Indoor housing may help, but it isn't automatically the best welfare outcome. Sort each evidence card as a benefit, concern, or measurable safeguard.</p><div class="grid"><div class="card photo-card"><img src="${IMAGES.calf}" alt="Photograph of calf on bedding"><div class="inside"><strong>Option A: Indoor winter housing</strong><p class="mini">Shelter and control; potential airflow and movement trade-offs.</p></div></div><div class="card photo-card"><img src="${IMAGES.horse}" alt="Photograph showing outdoor livestock enclosure and horses"><div class="inside"><strong>Option B: Outdoor pasture</strong><p class="mini">Room to move; exposure to severe weather requires a protection plan.</p></div></div></div><div class="note warning">Choose the correct classification for each field statement. A defensible plan includes a measurable safeguard, not just an opinion.</div>${housingItems.map((it,i)=>`<div class="card" style="margin:10px 0"><strong>${i+1}. ${esc(it[0])}</strong><div class="actions">${[['benefit','Benefit'],['concern','Concern'],['safeguard','Safeguard']].map(([v,t])=>`<button class="btn ${state.housing[i]===v?'':'light'}" onclick="setHousing(${i},'${v}')">${t}</button>`).join('')}</div></div>`).join('')}<div class="actions"><button class="btn" onclick="gradeHousing()">Evaluate housing plan</button><button class="btn light" onclick="go('handling')">Next mission →</button></div><div id="feedback"></div>`;}
function setHousing(i,v){state.housing[i]=v;save();render();}function gradeHousing(){if(Object.keys(state.housing).length<6){$('feedback').innerHTML='<div class="result err">Classify all six statements first.</div>';return;}let n=housingItems.filter((it,i)=>state.housing[i]===it[1]).length;let pts=Math.round(n*15/6);award('housing',pts);$('feedback').innerHTML=`<div class="result">${n}/6 correct • ${pts}/15 points. ${n===6?'Excellent—your plan acknowledges benefits, concerns and safeguards.':'Review which items describe a benefit, a competing concern or an action you can monitor.'}</div>`;}
function handling(){let p=+state.pressure;let zone=p<=34?'GREEN • CALM MOVEMENT':p<=68?'YELLOW • BALKING RISK':'RED • PANIC / INJURY RISK';return `<div class="kicker">MISSION 3 • 20 POINTS</div><h2>Handling lab: adjust the pressure</h2><p class="lead">Three cattle are crowding a narrow gate. One animal slips. Your crew must stop unsafe pressure and redesign the movement plan.</p><div class="grid"><div class="card"><h3>Pressure &amp; release simulator</h3><label for="pressure">Handler pressure: ${p}%</label><input class="range" id="pressure" type="range" min="0" max="100" value="${p}" oninput="pressureChange(this.value)"><div class="meter"><div class="marker" id="marker" style="left:calc(${p}% - 2px)"></div></div><strong id="zone">${zone}</strong><p class="mini" id="zoneDetail">${p<=34?'Calm movement is more likely when pressure is controlled and released appropriately.':p<=68?'Crowding and balking may increase. Back off and reassess.':'Excessive pressure may trigger panic, slipping and injury. Stop and reset.'}</p><div class="note warning">A slider is a simplified teaching model—not a measurement of real animal stress. Always follow trained supervision and site procedures.</div></div><div class="card"><h3>Point-of-balance decision</h3><p>To encourage a calm animal to move forward, where should a trained handler generally work relative to the shoulder, while respecting the flight zone and escape routes?</p>${[['behind','Behind the point of balance'],['ahead','Ahead of the point of balance'],['front','Directly in front of the animal']].map(([v,t])=>`<button class="choice ${state.handlingAnswer===v?'selected':''}" onclick="setHandling('${v}')">${t}</button>`).join('')}<p class="mini">Ahead of the shoulder tends to stop or turn the animal; behind it can encourage forward movement.</p></div></div><div class="card soft"><h3>Immediate response: put the actions in order</h3><p>For the slipped animal, choose the safest first response:</p><div class="grid">${[['stop','Stop pressure, secure the area, inspect footing, then resume only when safe'],['force','Increase pressure so the group clears the gate faster']].map(([v,t])=>`<button class="choice ${state.answers.handlingSafety===v?'selected':''}" onclick="setAnswer('handlingSafety','${v}')">${t}</button>`).join('')}</div></div><div class="actions"><button class="btn" onclick="gradeHandling()">Run handling safety check</button><button class="btn light" onclick="go('bio')">Next mission →</button></div><div id="feedback"></div>`;}
function pressureChange(v){state.pressure=+v;save();let p=+v;$('marker').style.left=`calc(${p}% - 2px)`;$('zone').textContent=p<=34?'GREEN • CALM MOVEMENT':p<=68?'YELLOW • BALKING RISK':'RED • PANIC / INJURY RISK';$('zoneDetail').textContent=p<=34?'Calm movement is more likely when pressure is controlled and released appropriately.':p<=68?'Crowding and balking may increase. Back off and reassess.':'Excessive pressure may trigger panic, slipping and injury. Stop and reset.';document.querySelector('label[for="pressure"]').textContent='Handler pressure: '+p+'%';}function setHandling(v){state.handlingAnswer=v;save();render();}function setAnswer(k,v){state.answers[k]=v;save();render();}function gradeHandling(){if(!state.handlingAnswer||!state.answers.handlingSafety){$('feedback').innerHTML='<div class="result err">Choose the point-of-balance and incident responses.</div>';return;}let n=(state.pressure<=34?8:0)+(state.handlingAnswer==='behind'?6:0)+(state.answers.handlingSafety==='stop'?6:0);award('handling',n);$('feedback').innerHTML=`<div class="result">Handling safety: ${n}/20. ${n===20?'Well managed.':'For a slipping animal, stop pressure and correct footing and crowding before resuming.'}</div>`;}
const bioTasks=[['Separate the new or sick animal into the quarantine zone','isolate'],['Route people and equipment to prevent cross-contamination','traffic'],['Clean and sanitize shared equipment at transition points','sanitize'],['Document health concerns and inspection findings','document']];const bioCorrect=['isolate','traffic','sanitize','document'];
function bio(){return `<div class="kicker">MISSION 4 • 15 POINTS</div><h2>Biosecurity: build the safe workflow</h2><p class="lead">A newly arrived animal is on-site. The main herd is healthy. Design a sequence that protects both populations, using the field-guide principles. Click cards in order or drag them into the workflow.</p><img class="photo" src="${IMAGES.quarantine}" alt="Ranch poultry and quarantine areas, shown as photographic reference"><div class="note">🟢 <strong>Green zone:</strong> main herd &nbsp; | &nbsp; 🔴 <strong>Red zone:</strong> quarantine. Manage traffic and clean shared equipment between zones.</div><div class="grid"><div class="card"><h3>Available actions</h3><div class="stack">${bioTasks.map(([t,id])=>`<button class="choice" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${id}')" onclick="addBio('${id}')" ${state.bioOrder.includes(id)?'disabled':''}>${esc(t)}</button>`).join('')}</div></div><div class="card"><h3>Your field workflow</h3><div class="stack">${[0,1,2,3].map(i=>`<div class="drop ${state.bioOrder[i]?'filled':''}" ondragover="event.preventDefault()" ondrop="event.preventDefault();addBio(event.dataTransfer.getData('text/plain'))"><strong>${i+1}.</strong> ${state.bioOrder[i]?esc(bioTasks.find(t=>t[1]===state.bioOrder[i])[0]):'Drop or select an action'}</div>`).join('')}</div><div class="actions"><button class="btn light" onclick="state.bioOrder=[];save();render()">Clear sequence</button></div></div></div><div class="actions"><button class="btn" onclick="gradeBio()">Verify biosecurity plan</button><button class="btn light" onclick="go('decision')">Next mission →</button></div><div id="feedback"></div>`;}
function addBio(id){if(!bioCorrect.includes(id)||state.bioOrder.includes(id)||state.bioOrder.length===4)return;state.bioOrder.push(id);save();render();}function gradeBio(){if(state.bioOrder.length!==4){$('feedback').innerHTML='<div class="result err">Place all four actions into your workflow.</div>';return;}let n=state.bioOrder.filter((v,i)=>v===bioCorrect[i]).length,pts=Math.round(n*15/4);award('bio',pts);$('feedback').innerHTML=`<div class="result">${n}/4 actions in the intended training sequence • ${pts}/15 points. ${n===4?'Biosecurity plan verified.':'Review isolation, traffic control, cleaning, and documentation. In practice, some controls operate continuously or concurrently.'}</div>`;}
function decision(){return `<div class="kicker">MISSION 5 • 20 POINTS</div><h2>The ranch manager’s decision: safety vs. speed</h2><p class="lead">You have been called into an important management meeting. Your recommendation will guide how the ranch moves cattle for routine health checks, vaccinations and other care.</p>
<div class="card soft"><span class="tag">FIELD BRIEFING • YOUR JOB</span><h3>What happened at the handling facility?</h3><p>The ranch owner wants to move cattle efficiently, but workers have reported cattle <strong>slipping, stopping unexpectedly (balking), and becoming agitated</strong> in the existing handling system. The owner is considering two options. You must recommend one using <strong>observable evidence</strong>, not just personal preference.</p><p><strong>Your goal:</strong> Balance animal welfare, worker safety and handling efficiency. Explain what your choice improves, what it costs, and how the ranch will know whether it works.</p></div>
<div class="grid" style="margin-top:15px"><div class="card"><span class="tag">SYSTEM A • STRAIGHT CHUTE</span><h3>Faster processing</h3><p>✓ Moves cattle through more quickly</p><p>⚠ Cattle frequently balk and slip</p><p>⚠ Greater concerns about stress, injuries and worker safety</p></div><div class="card"><span class="tag">SYSTEM B • CURVED CHUTE</span><h3>Calmer movement</h3><p>✓ Better footing and quieter movement in observed trials</p><p>✓ Fewer slipping concerns</p><p>⚠ Takes more time to process cattle</p></div></div>
<div class="card" style="margin-top:15px"><h3>Your five-part management recommendation</h3><p class="mini">Complete each step. The dropdowns are scored automatically. Your written justification is saved in the field report for teacher review.</p><ol style="padding-left:22px"><li><strong>Choose a system.</strong> Which option best balances safety, welfare and efficiency?</li><li><strong>Choose field evidence.</strong> Which observation best supports your choice?</li><li><strong>Acknowledge a trade-off.</strong> What practical disadvantage must the ranch accept?</li><li><strong>Choose a measurable safeguard.</strong> What records will show whether conditions improve?</li><li><strong>Write 2–4 meaningful sentences.</strong> Explain your recommendation as though speaking to the ranch owner.</li></ol></div>
<div class="card soft" style="margin-top:15px"><h3>Build your recommendation</h3>
<label for="sys">1 • Recommended system</label><p class="mini">Select the system you would purchase or continue using.</p><select class="select" id="sys" onchange="state.choice=this.value;save()"><option value="B" ${state.choice==='B'?'selected':''}>System B — curved chute</option><option value="A" ${state.choice==='A'?'selected':''}>System A — straight chute</option></select>
<label for="evidence">2 • Best supporting field evidence</label><p class="mini">Choose the strongest actual observation, not an opinion.</p><select class="select" id="evidence" onchange="state.answers.evidence=this.value;save()"><option value="">Select evidence</option><option value="slip" ${state.answers.evidence==='slip'?'selected':''}>Observed slipping, balking, footing and calmer movement</option><option value="speed" ${state.answers.evidence==='speed'?'selected':''}>Only the number of cattle processed per hour</option><option value="guess" ${state.answers.evidence==='guess'?'selected':''}>A personal preference with no field observations</option></select>
<label for="trade">3 • Trade-off you must acknowledge</label><p class="mini">A good recommendation recognizes what the ranch may give up.</p><select class="select" id="trade" onchange="state.answers.trade=this.value;save()"><option value="">Select trade-off</option><option value="slow" ${state.answers.trade==='slow'?'selected':''}>System B takes longer to process cattle</option><option value="none" ${state.answers.trade==='none'?'selected':''}>There is no meaningful trade-off</option><option value="speed" ${state.answers.trade==='speed'?'selected':''}>Animal safety should be ignored to increase speed</option></select>
<label for="safeguard">4 • Measurable safeguard</label><p class="mini">Select evidence the ranch can collect over time to check results.</p><select class="select" id="safeguard" onchange="state.answers.safeguard=this.value;save()"><option value="">Select safeguard</option><option value="monitor" ${state.answers.safeguard==='monitor'?'selected':''}>Log slips, balking, injuries and handling conditions</option><option value="trust" ${state.answers.safeguard==='trust'?'selected':''}>Assume the equipment will always be safe</option><option value="skip" ${state.answers.safeguard==='skip'?'selected':''}>Skip inspections to save time</option></select>
<label for="rationale">5 • Your professional justification (2–4 sentences)</label><p class="mini">Name your system, cite a specific observation, acknowledge the trade-off and explain how you will measure success.</p><div class="note" style="margin:8px 0"><strong>Sentence starter (optional):</strong> I recommend System ___ because ___. Field observations show ___. Although this system ___, it would improve ___. I would monitor ___ to measure success.</div><textarea id="rationale" placeholder="Write a thoughtful recommendation to the ranch owner..." oninput="state.reflection=this.value;save()">${esc(state.reflection)}</textarea><p class="mini">Your writing must contain at least 2 sentences and 20 words. Length alone does not prove quality; your teacher can review the saved explanation.</p></div>
<div class="actions"><button class="btn" onclick="gradeDecision()">Submit recommendation</button><button class="btn light" onclick="go('report')">Go to final report →</button></div><div id="feedback"></div>`;}
function gradeDecision(){const a=state.answers;const words=state.reflection.trim().split(/\s+/).filter(Boolean);const sentences=(state.reflection.match(/[.!?]+/g)||[]).length;if(!a.evidence||!a.trade||!a.safeguard){$('feedback').innerHTML='<div class="result err">Complete all four selection fields before submitting.</div>';return;}if(words.length<20||sentences<2){$('feedback').innerHTML=`<div class="result err">Please write at least 20 words and two complete sentences in your justification. You currently have ${words.length} words and ${sentences} sentence endings. Use the sentence starter if helpful.</div>`;return;}let n=(state.choice==='B'?5:0)+(a.evidence==='slip'?5:0)+(a.trade==='slow'?5:0)+(a.safeguard==='monitor'?5:0);award('decision',n);const explanations=[['System choice',state.choice==='B','System B is supported by the observed better footing and calmer cattle; System A is faster but has slipping and balking concerns.'],['Field evidence',a.evidence==='slip','Observed slipping, balking, footing and calmer movement are more useful welfare and safety evidence than throughput alone or preference.'],['Trade-off',a.trade==='slow','System B takes longer to process cattle. A responsible recommendation acknowledges this efficiency cost.'],['Safeguard',a.safeguard==='monitor','Recording slips, balking, injuries and conditions provides measurable evidence of whether handling improves.']];$('feedback').innerHTML=`<div class="result"><h3>Decision board feedback • ${n}/20</h3><p>Your structured selections were scored automatically. Your written justification is saved for teacher review.</p>${explanations.map(([label,ok,why])=>`<p><strong>${ok?'✓':'↻'} ${label}:</strong> ${why}</p>`).join('')}<p><strong>Next step:</strong> ${n===20?'Strong recommendation! Continue to your final report.':'Review the explanations, adjust your choices and resubmit to improve your practice score.'}</p></div>`;}
function report(){let finished=['inspect','housing','handling','bio','decision'].every(k=>state.complete[k]);return `<div class="kicker">MISSION 6 • 10 POINTS</div><h2>Your ranch operations report</h2><p class="lead">Complete the final field record and capture your verification code. Your report summarizes practice performance and the reasoning you used.</p><div class="grid"><div class="card"><div class="score">${score()}<span style="font-size:20px;color:#667"> / 100</span></div><p>Practice points earned</p><p><span class="badge">${completeCount()} / 6 missions recorded</span></p></div><div class="card soft"><h3>Mission breakdown</h3>${[['inspect','Welfare inspection',20],['housing','Winter housing',15],['handling','Handling lab',20],['bio','Biosecurity workflow',15],['decision','Decision board',20],['report','Field report',10]].map(([id,t,max])=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:5px 0"><span>${t}</span><strong>${state.scores[id]||0}/${max}</strong></div>`).join('')}</div></div><div class="card" style="margin-top:14px"><h3>Final field log</h3><label for="student">Student name (optional; stays on this device)</label><input id="student" class="select" value="${esc(state.name)}" oninput="state.name=this.value;save()" placeholder="Your name"><label for="final">What would you change first on this ranch, and what observable evidence would show improvement?</label><textarea id="final" oninput="state.answers.final=this.value;save()" placeholder="I would ... I would measure ...">${esc(state.answers.final||'')}</textarea><p class="mini">The final field log is a reflection and is not assessed for writing quality by the simulation.</p><div class="actions"><button class="btn" onclick="finishReport()">Finalize field report</button><button class="btn light" onclick="print()">Print / Save PDF</button><button class="btn light" onclick="copyReport()">Copy report text</button></div><div id="feedback"></div></div>${state.complete.report?`<div class="note"><h3 style="margin:0">MISSION COMPLETE • VERIFICATION WORD</h3><p style="font-size:29px;font-weight:900;letter-spacing:2px;margin:8px 0">WELFAREFIRST</p><p>Record this word in your Canvas practice activity if your teacher requests it. This is a completion token, not a secure identity or grading mechanism.</p></div>`:''}<div class="divider"></div><div class="actions"><button class="btn light" onclick="go('inspect')">Review missions</button><button class="btn light" onclick="resetAll()">Reset all progress</button></div>`;}
function finishReport(){if(!['inspect','housing','handling','bio','decision'].every(k=>state.complete[k])){$('feedback').innerHTML='<div class="result err">Finish the first five missions before finalizing the report.</div>';return;}if((state.answers.final||'').trim().length<35){$('feedback').innerHTML='<div class="result err">Write a specific change and a measurable sign of improvement (at least 35 characters).</div>';return;}award('report',10);render();}function reportText(){return `UTVA Animal Science 1B — Module 14 Ranch Operations\nStudent: ${state.name||'(not entered)'}\nPractice score: ${score()}/100\nWelfare inspection: ${state.scores.inspect||0}/20\nWinter housing: ${state.scores.housing||0}/15\nHandling lab: ${state.scores.handling||0}/20\nBiosecurity: ${state.scores.bio||0}/15\nDecision board: ${state.scores.decision||0}/20\nFinal report: ${state.scores.report||0}/10\nRecommendation: System ${state.choice}\nEvidence justification: ${state.reflection}\nField log: ${state.answers.final||''}\nVerification: ${state.complete.report?'WELFAREFIRST':'Not completed'}`;}function copyReport(){let t=reportText();if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>alert('Report copied.')).catch(()=>prompt('Copy your report:',t));}else{prompt('Copy your report:',t);}}function resetAll(){if(confirm('Reset all simulation progress on this device?')){localStorage.removeItem('utva_mod14_ranch_v1');location.reload();}}render();
</script></body></html>
